# SqueekChain (SQK) custom token launch.
#
# The launch compares the deployed bytes without the metadata hash, so `bytecode_hash = "none"`
# is required. The compiler is pinned by version (never by path); every worker and the verifier
# carry 0.8.26 offline. No ffi, no filesystem permissions.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
ffi = false
fs_permissions = []

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
